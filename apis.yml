aid: pactflow

name: PactFlow

description: PactFlow provides a comprehensive contract testing platform that enables developers and QA teams to create, verify, and maintain
  consumer-driven contracts for APIs and microservices. Built on the Pact framework and backed by SmartBear, PactFlow offers hosted Pact Broker
  services, CI/CD integrations, detailed reporting, and enterprise features such as role‑based access, audit logs, and compliance support. It
  helps organizations ensure reliable API interactions, reduce integration bugs, and accelerate delivery pipelines.

